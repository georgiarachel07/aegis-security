name: Extension tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install Chromium for the isolated extension smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/aegis-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/aegis-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the unpacked extension
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/aegis-browser/node_modules/playwright
          SCREENSHOT_DIR: ${{ runner.temp }}/aegis-preview
        run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: ${{ runner.temp }}/aegis-preview
